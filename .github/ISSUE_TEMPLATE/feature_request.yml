name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Keep requests focused on the plugin.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Mention which module it belongs to if you know.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
    validations:
      required: false
